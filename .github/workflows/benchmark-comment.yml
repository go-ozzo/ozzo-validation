name: Benchmark Comment

# Posts benchmark comparison results as PR comment.
# Triggered by workflow_run after "Benchmark Run" completes.
# Runs in trusted base repo context with write permissions.
# NEVER checks out or executes fork code.
#
# Security: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

on:
  workflow_run:
    workflows: ["Benchmark Run"]
    types:
      - completed

permissions:
  pull-requests: write

jobs:
  comment:
    name: Post Benchmark Comment
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'

    steps:
    - name: Download benchmark results
      uses: actions/download-artifact@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        run-id: ${{ github.event.workflow_run.id }}
        name: benchmark-results
        path: results

    - name: Read PR number
      id: pr
      run: |
        PR_NUMBER=$(cat results/pr-number.txt)
        echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT

    - name: Find existing comment
      uses: peter-evans/find-comment@v4
      id: fc
      with:
        issue-number: ${{ steps.pr.outputs.number }}
        comment-author: 'github-actions[bot]'
        body-includes: '## Benchmark Comparison'

    - name: Create or update comment
      uses: peter-evans/create-or-update-comment@v5
      with:
        comment-id: ${{ steps.fc.outputs.comment-id }}
        issue-number: ${{ steps.pr.outputs.number }}
        body-path: results/comparison.md
        edit-mode: replace
