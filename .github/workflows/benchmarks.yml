name: Benchmark Run

# Two-workflow pattern for fork PR safety (GitHub Security Lab recommended):
# 1. This workflow: runs benchmarks in sandboxed pull_request context (read-only token)
# 2. benchmark-comment.yml: posts results via workflow_run (write token, no fork code)
#
# Why: pull_request from forks gets read-only GITHUB_TOKEN.
# Using pull_request_target would give write access to fork code = "pwn request" vulnerability.
# See: https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  benchmark-run:
    name: Benchmark Run
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
    - name: Checkout PR branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        path: pr

    - name: Checkout base branch
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.pull_request.base.sha }}
        path: base

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.25'
        cache: false

    - name: Install benchstat
      run: go install golang.org/x/perf/cmd/benchstat@latest

    - name: Run base branch benchmarks
      working-directory: base
      run: |
        go test -bench=. -benchmem -count=5 -benchtime=100ms -run=^$ ./... > ../base-bench.txt 2>/dev/null || true

    - name: Run PR branch benchmarks
      working-directory: pr
      run: |
        go test -bench=. -benchmem -count=5 -benchtime=100ms -run=^$ ./... > ../pr-bench.txt 2>/dev/null || true

    - name: Compare benchmarks
      run: |
        benchstat base-bench.txt pr-bench.txt > full-comparison.txt 2>&1 || echo "benchstat comparison failed" > full-comparison.txt

        GEOMEAN=$(grep -E "^geomean" full-comparison.txt | head -1 || echo "")
        REGRESSIONS=$(grep -E "\+[0-9]+\.[0-9]+%" full-comparison.txt | grep -v "~" | head -10 || echo "")

        echo "## Benchmark Comparison" > comparison.md
        echo "" >> comparison.md

        if [ -n "$GEOMEAN" ]; then
          echo "**Summary:** \`$GEOMEAN\`" >> comparison.md
          echo "" >> comparison.md
        fi

        if [ -n "$REGRESSIONS" ]; then
          echo "⚠️ **Potential regressions detected:**" >> comparison.md
          echo "\`\`\`" >> comparison.md
          echo "$REGRESSIONS" >> comparison.md
          echo "\`\`\`" >> comparison.md
          echo "" >> comparison.md
        else
          echo "✅ No significant regressions detected." >> comparison.md
          echo "" >> comparison.md
        fi

        echo "> Full results available in workflow artifacts. CI runners have ~10-20% variance." >> comparison.md

    - name: Save PR number
      run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

    - name: Upload benchmark results
      uses: actions/upload-artifact@v7
      with:
        name: benchmark-results
        path: |
          base-bench.txt
          pr-bench.txt
          full-comparison.txt
          comparison.md
          pr-number.txt
        retention-days: 7
